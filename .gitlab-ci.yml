# GitLab CI für das Real Exam English Fanwiki – dieselben Skripte wie am PC.
#   ci      : python scripts/ci.py (Website bauen ohne Veröffentlichen, Artikel und Version prüfen)
#   release : scripts/release.mjs --all-missing (Tags vX.Y.Z + CHANGELOG-Abschnitte als GitLab-Releases)
# Runner: seit 08.11.2026 die Linux-Runner von gitlab.com (Konto verifiziert), nicht mehr acespc. Das GitLab-Projekt ist privat.
# KEIN Pages-Job: Die Seite wird nicht veröffentlicht, bis Alex entschieden hat (Volltranskripte ohne Erlaubnis).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  image: python:3.12  # nur Standardbibliothek nötig; mit git

variables:
  PYTHONUTF8: "1"

ci:
  script:
    - python scripts/ci.py

release:
  stage: deploy
  image: node:22
  needs: [ci]
  variables:
    GIT_DEPTH: "0"
  script:
    - node scripts/release.mjs --all-missing --title "Real Exam English Fanwiki"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [package.json, CHANGELOG.md]
