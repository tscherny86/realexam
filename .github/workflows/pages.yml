# NICHT VERÖFFENTLICHEN (07.11.2026): Volltranskripte eines fremden Podcasts ohne Erlaubnis, möglicher Auslöser der
# GitHub-Sperre. Läuft nur per Hand UND nur, wenn Alex die Repo-Variable PAGES_FREIGABE=ja setzt.
name: Website (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PAGES_FREIGABE == 'ja' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
