# Creates the GitHub release vX.Y.Z for every version in CHANGELOG.md that has no release yet.
# If the heading names a commit (back-dated history), the release points there, otherwise to the current commit.
name: Release
# Logik in scripts/release.mjs – dasselbe Skript läuft am PC und in GitLab CI (Regel „GitHub-Unabhängigkeit“, 07.11.2026).

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --all-missing --title "Real Exam English Fanwiki"
